<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nova Electronics Manufacturing & Distribution ERP System" />
    <title>NovaERP — Electronics Manufacturing & Distribution</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;white-space:pre-wrap;font-family:monospace;"><b>Global Error:</b><br/>' + event.error?.stack + '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;white-space:pre-wrap;font-family:monospace;"><b>Unhandled Promise Rejection:</b><br/>' + event.reason?.stack + '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
